  title: "Accelerating systematic reviews with automation tools"
  themes: []
  id: 2084
  speakers: [306]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Background: The use of automation tools to assist in systematic review production is becoming more common. Most tools assist with, 1) identifying and removing duplicate records and 2) screening and selection of relevant studies. The Evidence Review Accelerator (TERA) supports all tasks in review production. TERA assists with designing the review question, searching for and deduplicating studies, selecting studies, data extraction, conducting multiple types of meta-analysis and writing the methods and results.
</p><p>
TERA is purpose built by the two-week systematic review team (2weekSR) to enable full reviews to be completed in vastly reduced timeframes. We published an analysis of 10 of our reviews showing median time to completion was 11 workdays. 
</p><p>
Objectives: This workshop will show participants how to use TERA and how it fits into review workflows to improve the speed and quality of conducting systematic reviews.
</p><p>
Description: The workshop will comprise live demonstrations of TERA, conducted by the TERA developers and expert users of the tools. The live demonstration will be interspersed with hands on tutorials in using the tools. Interactive feedback with the presenters will be encouraged, and sufficient time for this is incorporated in the design of the workshop. The expert skills of the presenters in both conducting reviews and using the tools is a key component of the workshop. All the tools in the workshop are free and available to be used via the Evidence Review Accelerator website: https://tera-tools.com/
</p><p>
Activities/Interaction Plans: The workshop will comprise of the following plan: 1) a brief introduction; 2) an interactive component with the presenters and participants designing and writing a review using the Methods Wizard; 3) a demonstration of creating focused searches using the Word Frequency Analyser, SearchRefiner, Polyglot Search Translator and the Deduplicator; 4) a demonstration of Generative AI powered screening using MechaScreener; 5) a demonstration of citation searching with SpiderCite; 6) interactive discussion and demonstration of the meta-analysis tools, MetaInsight, MetaDTA, MetaWise; 7) Using TERA Farmer to test whether all relevant studies have been found.</p>"
-
  title: "Lost in translation? Using AI tools for cross-cultural and multilingual research"
  themes: []
  id: 2085
  speakers: [307]
  subtype: Workshop
  service:
  hidden: false
  description: "AI tools are increasingly used by researchers to translate documents, draft communications, and process data across languages. But translation is only part of the challenge — and often the easier part. This session draws on real examples from ethnographic fieldwork in rural Yunnan, China, to explore where AI tools genuinely help, where they fall short, and what the researcher must bring that AI cannot. We will look at three concrete cases. Participants will leave with practical strategies for integrating AI into multilingual research workflows while maintaining cultural rigour and research ethics."
-
  title: "Stop presenting: Start storytelling"
  themes: []
  id: 2086
  speakers: [308]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Most scientific presentations fail not because the research is weak—but because the story is buried.
</p><p>
This workshop teaches researchers how to transform results and complex science into compelling, logically structured presentations without sacrificing rigor. Participants will learn how to apply narrative principles to scientific talks—clarifying their core message, structuring results for maximum impact, and designing slides that support thinking rather than distract from it.
</p><p>
Through real examples and practical frameworks, attendees will leave with concrete tools to:</p>
<ul>
<li>Identify and sharpen the central message of their work</li>
<li>The benefits of 'thinking outside the box' on occasion</li>
<li>Structure presentations around a clear narrative arc</li>
<li>Design figures and slides that enhance comprehension</li>
<li>Avoid common pitfalls that undermine clear messaging</li>
<li>Communicate complex research with clarity and confidence</li>
</ul>
<p>This is not a workshop on aesthetics. It is a workshop on thinking clearly—and making that thinking visible.</p>"
