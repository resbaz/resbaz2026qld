  title: "Species distribution modelling in EcoCommons: Introduction to platform and notebook workflows for research"
  themes: []
  id: 2087
  speakers: [237,312]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>EcoCommons Australia offers a comprehensive suite of resources for ecological modelling, including an intuitive, user-friendly platform featuring thousands of trusted datasets and a range of expert-developed workflows for species distribution and community modelling.
</p><p>
This workshop will begin with a brief introduction into species distribution model (SDM) theory, followed by a guided tour of the EcoCommons platform and coding notebook workflows. There will also be a focus on selecting appropriate occurrence and environmental data for research aims and questions.
</p><p>
We will cover:</p>
<ul>
<li>Basic concepts and applications of SDMs</li>
<li>How to access and acquire biodiversity records from open data portals</li>
<li>An introduction to the EcoCommons platform and its 59,000 curated environmental datasets</li>
<li>Selecting sensible model data for research</li>
<li>Building SDMs using a selection of the 19 available algorithms on the EcoCommons platform (detailed example of GLM and Maxent algorithms)</li>
<li>Exploring and interpreting model outputs.</li>
<li>Using EcoCommons notebooks to convert between spatial file formats and modify spatial outputs</li>
</ul>
<p>By the end of the workshop, attendees will understand how to:</p>
<ul>
<li>Navigate the EcoCommons platform</li>
<li>Select fit-for-purpose data for your research question</li> 
<li>Run robust and repeatable SDMs</li>
<li>Produce accurate and meaningful results and modify model outputs for downstream workflows and reporting</li>
<li>Access and use EcoCommons coding notebooks</li>
</ul>"
-
  title: "Designing literature review matrices with Excel and Power BI"
  themes: []
  id: 2088
  speakers: [311]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This interactive workshop introduces a structured and data-driven approach to conducting literature reviews using Excel-based matrix outlining and Power BI dashboards. Participants will learn how to design and build a relational literature review database that supports systematic organization, citation extraction, and writing alignment for academic research (e.g., theses, journal articles, and systematic reviews).
</p><p>
The session will cover:</p>
<ul>
<li>Designing a structured literature review database in Excel (articles, metadata, classification)</li>
<li>Building a citation extraction matrix aligned with writing purposes</li>
<li>Linking sources to themes, categories, and sections of a research document</li>
<li>Using Power BI to create dashboards for exploratory analysis (e.g., trends by year, topic distribution, methodological patterns)</li>
<li>Leveraging dashboards to support sensemaking and academic writing</li>
</ul>
<p>By the end of the workshop, participants will have a reusable workflow to manage, analyse, and operationalise literature for research writing.</p>"
