#   description: "<p>EcoCommons Australia hosts a variety of Advanced Ecological Modelling Notebooks aimed at bridging the gap between platform-based analysis tools and hands-on coding. EcoCommons offers notebooks in both Quarto markdown (.qmd) and Jupyter Notebook (.ipynb) formats, making it easier for users to interact with and customise workflows. This workshop will focus on a notebook which guides users through the process of calculating and visualising Species Richness and Shannon diversity indices, which are a commonly used metrics for analysing and conducting statistical comparisons for ecological surveys.</p>
