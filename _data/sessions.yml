  title: "Speaking industry’s language: how ON helps turn research into real-world value"
  themes: []
  id: 2012
  speakers: [244]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>CSIRO’s ON Innovation Program will host an interactive panel and hands-on workshop showing researchers how to move from “grant-speak” to partnership-ready impact stories that resonate with industry, government and investors.
  </p><p>
  Unpack the core ingredients for research commercialisation success - clarity, customers, community and impact - and show how these translate into compelling value propositions for non-academic partners.  
  </p><p>
  The panel will explore real-world examples of ON teams who have used customer discovery to identify industry needs, navigate institutional pathways and build collaborations that accelerate translation, from licensing and joint ventures to startups and policy influence.  
  </p><p>
  In the workshop, participants will use practical ON tools (including an Impact & Commercialisation Pathway Canvas and 30/60/90-day impact roadmaps) to reframe their own projects around problems, users and value, then craft concrete next steps towards an industry conversation.   
  </p><p>
  Attendees will leave with a draft impact narrative, clearer language for describing benefits to partners, and a simple action plan to progress at least one potential collaboration opportunity.  
  </p>"
-
  title: "Writing better, 'long-surviving' code as bioscientists"
  themes: []
  id: 2045
  speakers: [271]
  subtype: Workshop
  service:
  hidden: false
  description: "Most research code works… until it doesn’t. In this talk, I’ll walk through shifting from writing one-off scripts to building a real, deployable tool (in the genomics context with Python), and the software engineering principles that should matter for scaling and reusability. It is not a coding tutorial but a practical look at how small decisions in research code shape whether it quietly collapses under its own weight, illustrated with recommended practices and relevant supporting Python packages. It will also touch on publishing research packages for public use, with pip and conda."
-
  title: "Human-AI dialogue for research idea Generation"
  themes: []
  id: 2046
  speakers: [272]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This interactive workshop explores how structured dialogue with AI can support research thinking, idea generation, and reflective learning.
</p><p>
Using examples from an experimental e-book project titled 'Idea Builder: A Billion-Dollar Brain', the session demonstrates how conversations between a human and AI can function as a cognitive workflow for developing research questions, clarifying concepts, and generating new ideas.
</p><p>
Participants will learn a simple Human-AI dialogue framework that transforms curiosity into researchable questions. Through guided exercises, attendees will experiment with AI-assisted thinking to explore their own research interests.
</p><p>
The workshop also introduces a broader philosophical perspective on learning beyond traditional classroom structures and discusses the emerging role of AI as a thinking partner in academic knowledge creation.
</p>"
-
  title: "How to wrestle a billion words (of Hansard)"
  themes: []
  id: 2047
  speakers: [202,273]
  subtype: Workshop
  service:
  hidden: false
  description: "This workshop aims to show you how you can make the most of the Proceedings of Australian Federal Parliament (1901-present) in your research. We will start by showing you some of how Parliament works through their official transcripts and explore their search interface. Then we will show you how you can take things to the next level with computational tools to analyse a.) the passage of a specific piece of legislation and b.) explore how particular language is used since Australia's Federation."
-
  title: "NCBI Genome Portal essentials: Finding, viewing and comparing genomes"
  themes: []
  id: 2048
  speakers: [274]
  subtype: Workshop
  service:
  hidden: false
  description: "This hands-on workshop introduces participants to the National Center for Biotechnology Information (NCBI) database and some of its tools, with a focus on genomes, exploring annotations, and using genome browsers and comparative tools. Participants will learn how to efficiently locate genomic resources and interpret genome structure and annotation directly within NCBI."
-
  title: "Word sucks for long form writing! Thesis and manuscript writing using fit for purpose software"
  themes: []
  id: 2049
  speakers: [275]
  subtype: Workshop
  service:
  hidden: false
  description: "This workshop introduces software designed for long-form academic writing, highlighting its capacity to help researchers organise their thoughts, structure chapters, and support conceptual thinking. Software like Scrivener and its freeware alternatives are project-based systems, with entire manuscripts residing in a single hierarchised file. Unlike Word's document-centric approach, these programs integrate structure and content management, enabling researchers to store multiple drafts, compile references and notes, and to experiment with restructuring sections and chapters with ease. This focus prioritises developmental thinking over the pressure to produce polished writing immediately. Participants will learn how these programs enable 'writing for thinking' rather than 'writing up' and reduce the chaos of multiple open documents during thesis or manuscript development."
-
  title: "Practical LLMs for research: From concepts to workflows"
  themes: []
  id: 2050
  speakers: [266]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This interactive session introduces researchers to practical uses of large language models (LLMs) across the research lifecycle. It combines conceptual understanding with hands-on demonstrations of real workflows.
</p><p>
Participants will:
</p>
<ul>
<li>Understand how LLMs work at a high level and their limitations</li>
<li>Learn effective prompting strategies and reasoning techniques</li>
<li>Explore literature review workflows using LLMs</li>
<li>Use LLMs for coding, data analysis, and research automation</li>
<li>Discuss reliability, ethics, and responsible use in research</li>
</ul>
<p>The session is designed to be accessible across disciplines, with examples from scientific and data-driven research.</p>"
-
  title: "Mastering Open Ecoacoustics: From passive monitoring to AI species recognition"
  themes: []
  id: 2051
  speakers: [276,277]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Passive Acoustic Monitoring (PAM) is revolutionizing how we study biodiversity, allowing us to listen to ecosystems at scales previously impossible. However, the sheer volume of audio data can be overwhelming. This hands-on workshop introduces Open Ecoacoustics, Australia's national infrastructure for managing and analysing environmental sound.</p><p>We will navigate the transition from deploying a sensor in the field to generating actionable conservation insights. Participants will receive a guided tour of Ecosounds and the A20 desktop tool, learning how to securely upload massive datasets and leverage cutting-edge AI. We’ll explore how tools like Google's Perch & BirdNet AI foundation models allow researchers to build species recognizers that scan thousands of hours of audio in minutes. Finally, we’ll discuss how to translate these acoustic detections into robust reports and downstream spatial models to inform policy and habitat management.</p>"
-
  title: "Relationship competencies for industry‑engaged research"
  themes: []
  id: 2052
  speakers: [278,279]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Successful industry‑engaged research depends on more than technical expertise — it requires strong relational capability. This interactive workshop explores the relationship competencies researchers need to build, sustain and leverage effective industry partnerships.
</p><p>
Participants will examine practical strategies for trust‑building, boundary spanning, stakeholder intelligence, negotiation and co‑creation. Through applied exercises and real‑world scenarios, attendees will learn how to navigate differing institutional cultures, align expectations, manage risk and design mutually beneficial collaborations.
</p><p>
The session is relevant to HDR candidates, early career researchers and established academics seeking to strengthen the impact and translational potential of their research through industry collaboration.
</p>"
-
  title: "Emergent conceptual frameworks in research design"
  themes: []
  id: 2053
  speakers: [257]
  subtype: Workshop
  service:
  hidden: false
  description: "Understand what an emergent conceptual framework is, identify research contexts and methodological approaches, develop an emergent conceptual framework based on research data, and learn how to write the methodology and discussion chapter."
-
  title: "Basic models and big impacts"
  themes: []
  id: 2054
  speakers: [280]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>What's the difference between important and interesting? How can I prove the impact of my project afterward? What's the direct value of this research?
</p><p>
Whether you're trying to raise a new project or focus an existing one, the humble spreadsheet can be a persuasive guide. And surprisingly easy to impress people with, since it's a convenient wrapping of some high-school algebra.
</p><p>
Post-PhD, I've been working to help get research out of the lab, and into the ocean. I'll discuss how technically-simple spreadsheets have directed research investment, demonstrated impacts at different scales, and reminded us of what matters once research leaves our hands. I'll also discuss the limits of the approach.
</p><p>
We'll also build a what-if model, to demonstrate the process in action, and show how the results can highlight the scope for new work ... and what will be difficult to justify.
</p>"
-
  title: "Graphical storytelling: Designing publication-ready figures for your research"
  themes: []
  id: 2055
  speakers: [281]
  subtype: Workshop
  service:
  hidden: false
  description: "This workshop introduces researchers to the principles of graphical storytelling and the design of clear, publication-ready figures. It focuses on how to plan figures with purpose, so that each image supports the narrative of a paper, thesis, or presentation rather than simply filling space. Topics include a practical checklist for figure design, choosing suitable plotting and design software, improving figure aesthetics, and using simple tools and resources to create cleaner and more effective visuals. Through examples and case studies, participants will learn how to move from raw content to figures that communicate methods, workflows, and results more clearly."
-
  title: "Data science for storytelling"
  themes: []
  id: 2056
  speakers: [282]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>The famous statistician John Tukey once said: 'The greatest value of a picture is when it forces us to notice what we never expected to see.' As researchers, identifying this 'unseen' in your data is becoming crucial to publishing your next journal paper. While publishing papers is essential, it’s just a part of research communication; to maximise the impact of your work, it’s vital that you make your research findings accessible and engaging to a wide audience. In this workshop, we will discuss the best methods to communicate the story that your data tells.</p>"
-
  title: "Data visualisation basics for publishing"
  themes: []
  id: 2057
  speakers: [201,283]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Explore methods and tools to create publication quality visualisations of structured, tabular data. Tools covered include MS Excel and open-source tool Raw Graphs.
</p><p>
On completion of this hands-on workshop, participants will be familiar with:
</p>
<ul>
<li>appropriate visualisation models for a dataset</li>
<li>visualisation tools and steps for tabular data</li>
<li>methods to save a visualisation to a publication quality file format.</li>
</ul>"
-
  title: "Demystifying AI for research (V2): Introductory level class for AI beginners"
  themes: []
  id: 2058
  speakers: [206]
  subtype: Workshop
  service:
  hidden: false
  description: "An update to the original Demystifying AI for Research presented in 2023. This presentation covers the topic of how AI is involved in Research and is an introductory level class for AI beginners. The presentation talks about what AI is and what AI isn't. Covers the common ways researchers can interact with AI and ends by talking about what is going to happen in the future and just how fast AI is developing. It acts as an introduction to the ideas of AI for Research and the more practical follow-up Beginner level workshop."
-
  title: "From a mess to a map"
  themes: []
  id: 2059
  speakers: [202,249]
  subtype: Workshop
  service:
  hidden: false
  description: "This workshop will look at the problems which might be encountered turning messy text data into the very structured data needed for many kinds of computational analysis. As an example, we will start with data collected in an online survey about Australian slang and end with maps showing the comparative distribution of some slang terms across the country. We will look at parts of the workflow where computational approaches are useful (e.g. normalising typography and parsing complex responses), but will also emphasise the decisions which remain the responsibility of the researcher (e.g. categorising responses)."
-
  title: "Copyright made practical"
  themes: []
  id: 2060
  speakers: [284,262]
  subtype: Workshop
  service:
  hidden: false
  description: "This interactive 1.5‑hour workshop helps researchers build confidence in navigating copyright across the research lifecycle. After a short overview of key copyright principles and why they matter, we work through real‑world scenarios - reusing figures, sharing datasets, including images in theses and other publications, and republishing your own work. Researchers will learn how to assess rights, identify risks, and make informed decisions. The session concludes with a live Q&A where participants can explore their own copyright questions."
-
  title: "Making the most of your qualitative transcripts with a little bit of computing"
  themes: []
  id: 2061
  speakers: [202]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Qualitative research projects sometimes get away from us and we find that we have more material than we know what to do with. This workshop aims to give you a pathway for navigating 'too much' with a little bit of computational assistance and *without* giving up on the core qualitative foundation of of your work.
</p><p>
We'll work through a case study and some demonstration tools to help you:
</p>
<ul>
<li>Make the most of your transcripts by identifying consistency issues that will confuse a computer (and maybe your collaborators)</li>
<li>Work through marking up some transcripts in a more consistent format</li>
<li>Demonstrate some possibilities for computers to help you search and find things</li>
<li>Demonstrate computational methods that might help you address the 'big picture' or what you might be missing, while still being able to close read your transcripts</li>
</ul>"
-
  title: "AI-assisted programming: No autopilot required"
  themes: []
  id: 2062
  speakers: [285]
  subtype: Workshop
  service:
  hidden: false
  description: "AI tools can accelerate coding, but blind trust creates fragile and insecure workflows. This workshop introduces a human in the loop approach to AI assisted programming, focusing on how to work directly with AI outputs while keeping full control of the code. It covers key principles, limitations, and guardrails for responsible use, followed by practical, example driven use of AI for code generation, refactoring, explanation, and testing in real workflows. Designed for researchers who want AI assistance rather than an autopilot."
-
  title: "OmniRestore: Robust universal image restoration from combined and unspecified degradations"
  themes: []
  id: 2063
  speakers: [286]
  subtype: Workshop
  service:
  hidden: false
  description: "A novel restoration framework for removing combined and unspecified combinations of degradations present in an image"
