  company: QUT
  title: Chief Investigator (Digital Media Research Centre); Senior Lecturer in Creative Industries (Creative Industries, Education and Social Justice Faculty)
  bio: "Ruari Elkington is a Chief Investigator with QUT’s Digital Media Research Centre and publishes in the field of screen distribution, screen studies and education. Dr Elkington’s industry engagement and academic research is driven by questions around how screen content connects with discrete audiences in markets increasingly under pressure through creative and commercial tensions. His screen industry experience centred on the acquisition, marketing and distribution of documentary, feature film and innovative digital content to theatrical and online audiences and his scholarship remains driven by questions of how screen content connects with discrete audiences in spaces increasingly under pressure from creative and commercial tensions. Alongside Dr Tess Van Hemert, he co-leads the ‘Resilient Screens’ research project within the Transfroming Media INdustries program  of the DMRC. Over the last three years ‘Resilient Screens’ has collaborated on funded audience research with peak bodies in Australian film distribution and exhibition (NACO/CAA, ICA, MPDAA) and produced several industry reports for film festivals (BIFF) and major independent exhibition chains (Palace Cinemas). He is currently a Senior Lecturer in Creative Industries at the Queensland University of Technology’s Creative Industries, Education and Social Justice Faculty"
