  bio: "<p>Aleksandra Olechnowicz is the eGrad School Online Module Coordinator within the Graduate Research Education Development team at Queensland University of Technology (QUT). She leads the design and delivery of digital and professional capability modules for HDR students and researchers across Australia and internationally.
</p><p>
Her work focuses on digital research skills, ethical AI use, research communication, and accessible online research training. She coordinates the annual eGrad School Global Conference and collaborates with national and international partners to enhance researcher development.
</p><p>
Aleksandra is passionate about practical, accessible AI literacy that empowers researchers to work smarter — without compromising research integrity.</p>"
