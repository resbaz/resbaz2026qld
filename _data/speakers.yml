  id: 325
  name: Dr Caitie
  surname: Kuempel
  pronouns: 
  company: Griffith University
  title: Senior Lecturer
  bio: "Dr Kuempel leads the Sustainable Seas Research Group at Griffith University. SSRG uses quantitative tools to synthesise new and existing data to assess the what and where of human impacts on the environment and the environments impact on humans from local to global scales, particularly in our world’s oceans. This information is then used to actions and policies to minimise these threats. Her work largely falls within four main themes: 1) mapping impacts of human activities, 2) spatial conservation planning, 3) land-sea interactions and 4) measuring trade-offs and progress towards sustainability goals. She is also passionate about science communication and open, reproducible research."
