  bio: "Jill Blacker is an innovative administrative manager with over 15 years’ experience in the higher education sector working across many different areas including action research projects focused on the widening participation agenda. She has extensive experience providing support to researchers, supervisors, and academic leaders on all aspects of higher degree research; and has a proven track record of resolving complex cases to ensure mutually agreeable outcomes. She is a confident mentor and coach and has been drawn to learning about mental health practices and strategies to provide support to researchers and supervisors. Building relationships and working collaboratively and creatively is a key component of her professional practice. She is a Fellow of Advance HE."
