  bio: "<p>Anjusree is a Doctoral Researcher at Griffith University, focusing on Computer Vision, Image Restoration, and Deep Learning. Her research develops advanced deep learning and generative AI methods, including diffusion models and Vision Transformers, to restore and enhance degraded visual data for more reliable vision-based systems.Alongside her PhD, she holds a Master of Technology (by Research) in Computer Science and Engineering from Kerala University, India, where she published research in computer vision at national and international conferences. She brings over six years of professional experience across academia and industry. She has worked as an IT Support Officer at Migrant and Refugee Settlement Services (MARSS), Canberra, where she supported IT systems, user training, and technical operations. Prior to that, she spent six years as an Assistant Professor in Computer Science, contributing to teaching, mentoring, and research supervision. She is passionate about applying computer vision and AI to real-world problems, particularly in image understanding, restoration, and generative modeling. She is currently open to opportunities in Computer Vision, Machine Learning, and AI roles in industry and research."
