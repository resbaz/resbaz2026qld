  id: 308
  name: Dr Georgia
  surname: Kafer
  pronouns: She/Her
  company: UniSC
  title: Senior Lecturer, School of Health
  bio: "<p>Dr. Georgia Kafer is a Senior Lecturer in the School of Health at the University of the Sunshine Coast and a core researcher within the Australian Centre for Pacific Islands Research. She earned her Ph.D. in Physiology from The University of Queensland, where she investigated epigenetic patterning during preimplantation development. Following her doctoral training, she completed a prestigious Japanese Society for the Promotion of Science (JSPS) Fellowship at Kyoto University before returning to Australia to join the Children’s Medical Research Institute (CMRI) as a research fellow and then in 2021, Dr. Kafer established the Fetal and Maternal Health Research Group at UniSC, including the development of the university’s first stem cell culture facilities. Her research program, supported by NHMRC funding, spans basic science, clinical research, and public health, with a focus on fetal and reproductive health.
</p><p>
Dr. Kafer has extensive experience communicating complex scientific concepts to diverse audiences. Her postdoctoral work in Japan strengthened her ability to present effectively to non–native English-speaking researchers, while her work with Pacific communities through the Australian Centre for Pacific Islands Research has further developed her cross-cultural communication skills. In addition, her role as a research fellow and ambassador for the Jeans for Genes charity at CMRI refined her capacity to translate rigorous science for broad public audiences. She is deeply committed to mentoring early-career researchers and supporting students to become clear, confident, and thoughtful scientific communicators.</p>"
