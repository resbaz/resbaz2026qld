  bio: "<p>Murray Lane is a Senior lecturer and Learning Designer within Graduate Research Education Development team at Queensland University of Technology (QUT). He is a research development and digital innovation specialist with extensive experience supporting researchers and research students across disciplines. His work focuses on strengthening digital capability, improving research practices, and enhancing engagement through technology-enabled learning environments.
