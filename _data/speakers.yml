  bio: "<p>Richelle Wight is an Innovation Program Advisor at CSIRO, where she leads the ON Prime Program, helping researchers and technologists explore pathways to translate their innovations into real-world impact. Through ON Prime, she works closely with research teams from universities, CSIRO and publicly funded research organisations, guiding them through customer discovery, market validation and the early stages of commercialisation.
</p><p>
With a strong background in innovation and entrepreneurship, Richelle supports researchers to step beyond the lab - connecting them with industry, investors and the broader innovation ecosystem. Her work focuses on building the capability and confidence of research teams to test assumptions, understand market needs and shape technologies that can solve meaningful problems for industry and society.
</p><p>
At CSIRO's ON Program, Richelle plays a key role in strengthening Australia’s research translation pipeline, helping bridge the gap between world-class research and real-world application.</p>"
