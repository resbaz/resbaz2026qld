  bio: "Robert Fleet is a Senior Data Scientist and Developer at the QUT Digital Observatory, where he designs innovative platforms and tools to analyse complex human data. With a diverse technical background, Robert has previously served as an eResearch Analyst and as the Technical Lead for a drone surveillance project. His current research focuses on the intersection of behavioural data and digital environments, specifically utilising Massive Multiplayer Online (MMO) game data. By examining these virtual ecosystems, Robert investigates the organisational structures of criminal groups, leveraging gaming metrics to uncover patterns of illicit collaboration. He combines advanced data science with software development to transform raw digital traces into actionable insights."
