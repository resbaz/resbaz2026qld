  bio: "Dr Abbe Winter (SFHEA) is a results-driven writing wellbeing specialist, collaborative mentor, and independent researcher, skilled in the analysis of words and data for user needs. Abbe is a researcher trainer, leader, and mentor, with over 20 years’ experience in quality assurance, and change and project management. While her PhD focused on what helps workers in higher education cope with large-scale organisational change, and she was part of the small team that created and developed the concept of academagogy (the scholarly leadership of learning), her more recent research has focussed upon professional identity, developing writing skills, and reflective practice."
