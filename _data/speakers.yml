  bio: "Kieran is the Chair of Law, Technology and Future at the School of Law, QUT. Kieran's research focuses on bringing together law, technology and the humanities to imagine and work towards better futures. He is founding general editor of Law, Technology and Humans. Kieran is particularly focused on supporting the next generation of researchers. The future needs their creativity and originality. He has supervised to completion 24 PhDs and is chair of the Council of Australian Law Deans thesis award committee."
