  company: QUT
  title: Wadjigan woman, Discipline Lead (Creative Industries), QUT College
  bio: "Celise Gibson is a proud Wadjigan woman (Batjamalh language group), artist and researcher. Her practice brings together cultural heritage, archives and storytelling to trace connections between memory, materiality and Indigenous knowledge systems. She is currently undertaking a PhD examining Aboriginal sovereignty and its enactment through artmaking, advancing the argument that creative practice itself constitutes a sovereign act. Using an Indigenist, arts-based methodology grounded in Wadjigan practices, her research centres sovereignty as something lived and enacted through relational, creative and accountable practice."
