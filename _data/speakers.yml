  bio: "Zachary Amir is a Principal Data Scientist working for TERN to develop the Wildlife Observatory of Australia (WildObs). Zachary's particular focus is on developing the WildObs database, a large standardized collection of camera trapping observations, deployments, and media that is accessible to researchers and biodiversity data aggregators. Zachary completed his PhD at UQ in 2024, having worked across the lifecycle of camera-trapping data, from fieldwork to research publications."
