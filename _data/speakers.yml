  bio: "Belinda Howard is a PhD Researcher in School of Education at Queensland University of Technology whose study examines the existence of career development policy in Australian secondary schools. She teaches Indigenous education and career development theory, policy, and practice , drawing on both research expertise and extensive professional experience. Affiliated with the QUT Centre for Inclusive Education and a member of the Career Development Association of Australia, she also writes Candidly Academic, a blog blending reflexive commentary with practical insights from her doctoral work. With more than 15 years’ experience across mainstream and alternative education settings, Belinda has supported schools to design and implement whole‑school approaches to career development, driven by a commitment to equity, disengaged learners, and improving young people’s transitions. Across her research, teaching, writing, and professional practice, she works to strengthen how career development is understood within education systems and to contribute to meaningful policy and practice reform."
