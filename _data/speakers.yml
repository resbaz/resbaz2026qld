  company: QUT
  title: PhD Candidate
  bio: "</p>Luis Alberto Porras is a PhD candidate at Queensland University of Technology (QUT), specialising in learning analytics, blended learning, and educational design research. His research focuses on how teachers use learning analytics dashboards to solve problems of practice and support data-informed decision-making.
</p><p>
He has developed systematic and data-driven workflows for literature reviews, integrating Excel-based matrix outlining with Power BI dashboards to support academic writing, synthesis, and research design. His work is grounded in pragmatism and focuses on practical, transferable research methods for higher education contexts.<p>"
