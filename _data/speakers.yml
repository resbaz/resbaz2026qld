  id: 105
  name: Prof. Paula
  surname: McDonald
  pronouns:
  company: QUT
  title: Deputy Vice-Chancellor and Vice-President (Research)
  bio: >-
    <p>Paula McDonald is Deputy Vice-Chancellor and Vice-President (Research) and a Professor of Work and Organisation. Since completing her PhD in 2004, Paula has worked closely with organisations in the public, private and community sectors on collaborative research which advances social justice in and beyond the workplace. Her research addresses:</p>

    <ul>
      <li>youth employment</li>
      <li>technology and work (digital platform work; automation and AI)</li>
      <li>vulnerable and disadvantaged worker groups</li>
      <li>customised/flexible work and public/private boundaries</li>
      <li>gendered dimensions of work (pay equality, everyday sexism)</li>
      <li>workplace discrimination (sex discrimination, sexual harassment)</li>
    </ul>

    <p>Paula has published 150 academic journal articles, books, chapters and industry reports in these fields. She has been awarded 10 Australian Research Council grants including a Future Fellowship from 2013-16; six as lead investigator. Paula’s research has had demonstrable impact via expert testimony, workplace training, commissioned research reports, media engagement, submissions to government inquiries, membership on steering committees, and public speaking engagements. Her research was selected for submission and ranked “high” in the 2018 Excellence in Research Australia for Field of Research code 15.</p>

    <p>Paula’s experience in higher education governance is reflected in her election and appointment to key university-level committees including QUT Council (2017-21); University Research Committee (2019-current); University Academic Board (2020-21; 2024-current); University Human Research Ethics Committee (2007-11); Academic Misconduct panels (2007; 2017); Research Degrees Committee (2011-12; 2024-current); ERA Research Quality groups (2015; 2018); and University Promotions Committee (2011-12).</p>

    <p>Prior to an academic career, Paula held clinical and research roles in child and adolescent psychiatry, medical education, primary care and public health. She was elected to the Australian Academy of Social Sciences in 2021. Paula is a registered psychologist with the Australian Health Practitioner Agency since 2003, a graduate of the Australian Institute of Company Directors, and a senior fellow of the UK Higher Education Academy.</p>
