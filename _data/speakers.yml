  id: 101
  name: Prof. Michael
  surname: Milford
  pronouns:
  company: School of Electrical Engineering & Robotics, Faculty of Engineering, QUT
  title: 
  bio: "<p>Michael Milford, FTSE, conducts interdisciplinary research at the intersection of robotics, neuroscience, and computer vision, and specializes in areas like autonomous vehicles and robot navigation. He currently holds appointments as Australian Research Council Laureate Fellow, Director of the QUT Centre for Robotics, QUT Professor, Microsoft Research Faculty Fellow, and Fellow of the Australian Academy of Technology and Engineering.</p>
<p>He has led or co-led projects totalling more than 56 million dollars in research and industry funding, receiving over 18,000 citations, and his work has culminated in numerous accolades, including six best paper awards (and ten finalists), the ATSE Batterham Medal, and a joint outright Queensland Young Tall Poppy award. In 2013, he was made a Microsoft Research Faculty Fellow, one of only three Australians ever to receive this recognition. From 2022 – 2027 he is leading a large research team combining bio-inspired and computer science-based approaches to provide a ubiquitous alternative to GPS that does not rely on satellites. Michael is also an educational entrepreneur: as founder of Math Thrills, he has produced engaging STEM education materials distributed to over 35 countries for more than 20 years.</p>
<p>As a keen mentor, Michael works with individuals and groups, both locally at the individual, institute or university level across Australia, but also globally through his Hacking Academia initiative: he won the 2025 Outstanding Mentor of Researchers Eureka Prize.</p>"
