  name: Murray
  surname: Lane
  pronouns: 
  company: QUT
  title: 
  bio: "<p>Murray Lane is a Senior lecturer and Learning Designer within Graduate Research Education Development team at Queensland University of Technology (QUT). He is a research development and digital innovation specialist with extensive experience supporting researchers and research students across disciplines. His work focuses on strengthening digital capability, improving research practices, and enhancing engagement through technology-enabled learning environments.
</p><p>
Murray has contributed to the design and delivery of research training initiatives that empower HDR students and early career researchers to improve their research skills and digital research practices. His interests include applications of AI in research contexts, research communication, and practical strategies that improve productivity while maintaining research integrity.
</p><p>
He is passionate about making digital tools accessible, practical, and meaningful for researchers at all stages of their careers.</p>"
