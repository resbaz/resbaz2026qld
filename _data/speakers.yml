  id: 323
  name: Dr Sumudu
  surname: Hewage (Panellist)
  pronouns: She/Her
  company: QUT
  title: 
  bio: "<p>Dr Sumudu Hewage (Hey-va-gey) is a researcher–educator at Queensland University of Technology who completed her PhD in 2025. Her work spans implementation science, health services research, and public health teaching, with roles at the Australian Centre for Health Services Innovation (AusHSI), the QUT School of Medicine, and the School of Public Health. Drawing on both her doctoral experience and current academic role, she brings a dual perspective as a recent HDR graduate and an early career academic to the discussion.
</p><p>
Drawing on her own HDR journey, Sumudu is particularly interested in the evolving relationship between students and supervisors across candidature, including taking an active role in research, navigating expectations and uncertainty. As an international graduate, she also brings insights into cultural expectations and norms that may shape the HDR journey for students from culturally and linguistically diverse backgrounds.
</p><p>
She is passionate about fostering psychologically safe and supportive research environments where students feel empowered and grow into independent researchers.</p>"
