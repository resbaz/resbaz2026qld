<!-- About Section -->
<section id="about" class="about">
    <div class="content-wrapper">
        <div class="col-lg-8 col-lg-offset-2">


            <a
			  href="/resbaz2026qld/registration/"
			  aria-label="Registrations are now open. Go to the registration page."
			  style="
				display: block;
				max-width: 980px;
				margin: 0 auto 28px;
				text-decoration: none;
				color: inherit;
			  "
			>
			  <div
				role="alert"
				style="
				  padding: 22px 28px;
				  background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 55%, #fed7aa 100%);
				  border: 1px solid #fdba74;
				  border-left: 8px solid #f97316;
				  border-radius: 18px;
				  box-shadow: 0 14px 34px rgba(249, 115, 22, 0.16);
				  text-align: center;
				  font-size: 1.35em;
				  font-weight: 700;
				  line-height: 1.4;
				  color: #431407;
				"
			  >
				<span
				  style="
					display: inline-block;
					margin-right: 10px;
				  "
				>
				  Registrations close on 16 June 11:45pm!
				</span>

				<span
				  style="
					display: inline-block;
					padding: 9px 21px;
					background: #ea580c;
					color: #ffffff;
					border-radius: 999px;
					font-size: 1.2em;
					font-weight: 800;
					letter-spacing: 0.02em;
					white-space: nowrap;
				  "
				>
				  Register now →
				</span>
			  </div>
			</a>


            <h2>{{ site.aboutTitle }}</h2>

            <div class="row about-details">
                {% assign animationDelay = 0 %}

                <div class="col-md-10 col-xs-10 col-md-offset-1 col-xs-offset-1">
                    <div class="animated hiding" data-animation="fadeInDown" data-delay="{{ animationDelay }}">
                        <h3>{{ site.aboutSubtitle }}</h3>

                        <!-- <p class="about-text">{{ site.aboutText }}</p> -->

                        <div class="about-text">
                            {{ site.aboutText }}
                        </div>
                    </div>
                </div>

                {% assign animationDelay = animationDelay | plus:500 %}
                {% if check == 0 %}
                    <div class="clearfix visible-xs"></div>
                {% endif %}
            </div>

			<!--<div class="about-cta">
				<a
					href="https://docs.google.com/forms/d/e/1FAIpQLSd689WEt6ZJPmd-833S7DaHjthJlvcNmm6qSfePuqnxiyrg6Q/viewform"
					target="_blank"
					rel="noopener noreferrer"
					class="btn about-cta-button"
				>
					Get involved!
				</a>
			</div> -->
		</div>
	</div>
</section>

<!-- End About Section -->
