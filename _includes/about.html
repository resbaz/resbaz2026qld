<!-- About Section -->
<section id="about" class="about">
    <div class="content-wrapper">
        <div class="col-lg-8 col-lg-offset-2">

            <div
              role="status"
              style="
                display: block;
                max-width: 980px;
                margin: 0 auto 28px;
                padding: 20px 28px;
                background: linear-gradient(135deg, #fffaf3 0%, #f8eadb 100%);
                border: 1px solid #e8c7a7;
                border-left: 6px solid #d69a63;
                border-radius: 18px;
                box-shadow: 0 8px 20px rgba(120, 80, 40, 0.08);
                text-align: center;
                font-size: 1.25em;
                font-weight: 700;
                line-height: 1.4;
                color: #3b2414;
              "
            >
              Registrations are now closed. See you at ResBaz!
            </div>

            <h2>{{ site.aboutTitle }}</h2>

            <div class="row about-details">
                {% assign animationDelay = 0 %}

                <div class="col-md-10 col-xs-10 col-md-offset-1 col-xs-offset-1">
                    <div class="animated hiding" data-animation="fadeInDown" data-delay="{{ animationDelay }}">
                        <h3>{{ site.aboutSubtitle }}</h3>

                        <!-- <p class="about-text">{{ site.aboutText }}</p> -->

                        <div class="about-text">
                            {{ site.aboutText }}
                        </div>
                    </div>
                </div>

                {% assign animationDelay = animationDelay | plus:500 %}
                {% if check == 0 %}
                    <div class="clearfix visible-xs"></div>
                {% endif %}
            </div>

			<!--<div class="about-cta">
				<a
					href="https://docs.google.com/forms/d/e/1FAIpQLSd689WEt6ZJPmd-833S7DaHjthJlvcNmm6qSfePuqnxiyrg6Q/viewform"
					target="_blank"
					rel="noopener noreferrer"
					class="btn about-cta-button"
				>
					Get involved!
				</a>
			</div> -->
		</div>
	</div>
</section>

<!-- End About Section -->
