<!-- About Section -->
<section id="about" class="about">
    <div class="content-wrapper">
        <div class="col-lg-8 col-lg-offset-2">


            <div
				role="alert"
				style="
					max-width: 980px;
					margin: 0 auto 24px;
					padding: 24px 28px;
					background: linear-gradient(135deg, #fff7f7 0%, #ffecec 100%);
					border: 1px solid #f3caca;
					border-left: 8px solid #c24141;
					border-radius: 14px;
					box-shadow: 0 8px 24px rgba(194, 65, 65, 0.12);
					text-align: center;
					font-size: 1.35em;
					font-weight: 600;
					line-height: 1.5;
					color: #4a1f1f;
				"
			>
				Registrations will open on
				<span
					style="
						color: #9f1239;
						font-weight: 800;
						background: #ffe0e6;
						padding: 2px 8px;
						border-radius: 8px;
						display: inline-block;
					"
				>
					13 May 2026
				</span>
				— please check back soon for further details.
			</div>


            <h2>{{ site.aboutTitle }}</h2>

            <div class="row about-details">
                {% assign animationDelay = 0 %}

                <div class="col-md-10 col-xs-10 col-md-offset-1 col-xs-offset-1">
                    <div class="animated hiding" data-animation="fadeInDown" data-delay="{{ animationDelay }}">
                        <h3>{{ site.aboutSubtitle }}</h3>

                        <!-- <p class="about-text">{{ site.aboutText }}</p> -->

                        <div class="about-text">
                            {{ site.aboutText }}
                        </div>
                    </div>
                </div>

                {% assign animationDelay = animationDelay | plus:500 %}
                {% if check == 0 %}
                    <div class="clearfix visible-xs"></div>
                {% endif %}
            </div>

            <br><br><br>

        </div>
    </div>
</section>

            <button type="button" class="btn">

            rel="noopener noreferrer"
        >
            <button type="button" class="btn btn-primary">

        <br><br>
    </div>
</section>
